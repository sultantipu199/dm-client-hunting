name: Daily Automated MENA Lead Scraper Pipeline

on:
  schedule:
    # 03:00 UTC = 06:00 AM Riyadh / GCC Time daily
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Lead Scraper & MENA Validation Matrix
        run: |
          python scripts/scraper.py

      - name: Commit and Push Updated Feed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "MENA Acquisition Bot"
          git add assets/data/leads_feed.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(feed): automated sync of fresh MENA remote enterprise leads [skip ci]" && git push)
